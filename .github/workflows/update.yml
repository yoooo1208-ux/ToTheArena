name: 更新處置股資料

on:
  schedule:
    # 週一到週五 台灣時間 21:15（UTC 13:15）；注意股、處置公告都已出來
    - cron: "15 13 * * 1-5"
  workflow_dispatch: {}        # 網頁上的「更新資料」按鈕 → Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 下載 FinLab 資料
        env:
          FINLAB_API_KEY: ${{ secrets.FINLAB_API_KEY }}
        run: python export_finlab.py

      - name: 計算聽牌狀態、產生網頁
        run: |
          mkdir -p site
          python process.py finlab_export site
          mv "site/處置股分析.html" site/index.html
          rm -f site/artifact_body.html
          touch site/.nojekyll

      - name: 資料日期檢查
        run: |
          python - <<'EOF'
          import json, pandas as pd
          d = json.load(open("site/disposal_data.json", encoding="utf-8"))
          m, D = d["meta"], d["dates"]
          ev = d["events"]; cols = d.get("evCols")
          st = [e["st"] if isinstance(e, dict) else e[cols.index("st")] for e in ev]
          last_ev = D[min(max(st), len(D) - 1)] if st else "-"
          n_recent = sum(1 for x in st if x >= len(D) - 10)
          di = pd.read_csv("finlab_export/disposal_information.csv.gz", usecols=["date"])
          ta = pd.read_csv("finlab_export/trading_attention.csv.gz", usecols=["date"])
          msg = (f"價格到 {m['priceLast']}｜注意股到 {m['attLast']}｜處置公告(原始)到 {di['date'].max()}｜"
                 f"注意股(原始)到 {ta['date'].max()}｜處置事件 {len(ev)} 筆，最後開始日 {last_ev}，近10日 {n_recent} 筆")
          print("::notice title=資料日期::" + msg)
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
